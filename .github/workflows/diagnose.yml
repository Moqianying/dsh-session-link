# CI（文件名为 diagnose.yml，避免新建工作流引入未知变量）
#
# 为什么拆成多个 job：
#   GitHub 的 job 日志需要登录态，而这个仓库的 step 级信息在匿名 API 里拿不到
#   （成功/失败都返回 steps=0，注解恒为 path=.github line=23）。
#   但 **每个 job 会各自对应一个 check-run**，其 name + conclusion 匿名可读。
#   于是「哪一步坏」可以直接从 API 看名字，不需要日志。
#
# 全部 job 都：runs-on ubuntu-24.04、零 `uses:`、匿名 git clone（仓库是公开的）。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner info
        run: |
          echo "whoami: $(whoami)"
          echo "uname: $(uname -a)"
          echo "pwd: $PWD"
          echo "node: $(command -v node || echo 'missing')"
          node --version || true
          echo "npm: $(npm --version 2>/dev/null || echo 'unavailable')"
          echo "git: $(git --version)"

  clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Anonymous git clone
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "$GITHUB_SHA"
          git log --oneline -1
          ls -la | head -n 20

  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Syntax check
        run: |
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "$GITHUB_SHA"
          for f in \
            packages/dsh-session-link/index.js \
            packages/dsh-session-link-preview/index.js \
            packages/dsh-session-link-preview/lib/impl.js \
            packages/dsh-session-link-client/client.js \
            packages/dsh-session-link-client/index.js
          do
            echo "check $f"
            node --check "$f"
          done

  package-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: package.json files are valid JSON
        run: |
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "$GITHUB_SHA"
          node scripts/check-package-json.cjs

  client-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Client smoke test (mini React, no browser)
        run: |
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "$GITHUB_SHA"
          node test/client-smoke.cjs

  host-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Host offline test (skips without session files)
        run: |
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "$GITHUB_SHA"
          node test/offline-test.cjs

  install-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install into a throwaway profile
        run: |
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/fake-dsh/profiles/web/node_modules"
          printf '[]\n' > "$RUNNER_TEMP/fake-dsh/profiles/web/cordis.patch.yml"
          chmod +x scripts/install.sh
          DSH_HOME="$RUNNER_TEMP/fake-dsh" ./scripts/install.sh
          node scripts/check-install-result.cjs "$RUNNER_TEMP/fake-dsh"
